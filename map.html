<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>齐齐哈尔文旅地图</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/transition.css">
  <!-- 预连接高德 CDN，省 DNS+TCP+TLS -->
  <link rel="dns-prefetch" href="//webapi.amap.com">
  <link rel="preconnect" href="https://webapi.amap.com" crossorigin>
  <style>
    /* 地图加载指示器 */
    #map-loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 999;
      background: var(--color-bg, #f5f3ef);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }
    #map-loading.done {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spin {
      width: 40px; height: 40px;
      border: 3px solid #e0d8c8;
      border-top-color: #c41e3a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #map-loading p {
      color: #999;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div id="map-loading">
    <div class="loading-spin"></div>
    <p>地图加载中…</p>
  </div>

  <!-- 页面转场帷幕 -->
  <div id="page-trans-overlay" class="page-trans-overlay">
    <div class="trans-curtain left"></div>
    <div class="trans-curtain right"></div>
    <div class="trans-glow-line"></div>
    <div class="trans-seal">
      <div class="seal-glow"></div>
      <div class="seal-ring r1"></div>
      <div class="seal-ring r2"></div>
      <div class="seal-ring r3"></div>
      <div class="seal-diamond"></div>
      <div class="seal-core">✦</div>
    </div>
    <div class="trans-sparkles"></div>
  </div>

  <header class="map-header">
    <a href="index.html" class="back-btn">← 返回</a>
    <span id="cur-title" class="map-title">地图</span>
    <span id="theme-badge" class="theme-badge">主题</span>
  </header>

  <div id="map"></div>

  <script src="js/data.js"></script>
  <script>
    // Amap 加载完成后回调
    window._onAMapReady = function () {
      var loading = document.getElementById('map-loading');
      if (loading) loading.classList.add('done');

      var script = document.createElement('script');
      script.src = 'js/map.js';
      document.body.appendChild(script);
    };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=69038979c0b3e3048e7da03f63ab75a5&callback=_onAMapReady" async></script>
  <script src="js/transition.js"></script>
</body>
</html>
