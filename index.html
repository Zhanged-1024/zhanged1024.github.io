<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>立秋时序书</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans CN', sans-serif;
            color: #e6d6ad;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            position: relative;
        }
        
        /* 背景图片容器 */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            filter: brightness(0.7) contrast(1.1);
            transition: filter 1.2s ease;
        }
        
        /* 深色遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 21, 31, 0.82);
            z-index: 1;
        }
        
        .container {
            width: 92%;
            max-width: 650px;
            min-height: auto;
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 7vmin 6vmin;
            background: rgba(12, 21, 31, 0.75);
            border-radius: 24px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(230, 214, 173, 0.3);
            margin: 5vmin auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: visible;
        }
        
        h1 {
            font-size: clamp(2.2rem, 7vw, 3.2rem);
            margin-bottom: clamp(25px, 5vw, 45px);
            text-shadow: 0 0 clamp(10px, 2vw, 20px) rgba(230, 214, 173, 0.65);
            letter-spacing: clamp(1px, 0.3vw, 2px);
            font-weight: 350;
            position: relative;
            padding-bottom: clamp(12px, 2vw, 18px);
            line-height: 1.3;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(70px, 25vw, 130px);
            height: clamp(1.5px, 0.4vw, 2.5px);
            background: linear-gradient(90deg, transparent, #e6d6ad, transparent);
        }
        
        .poem-container {
            display: flex;
            flex-direction: column;
            gap: clamp(18px, 4vw, 28px);
            margin: clamp(15px, 4vw, 35px) 0 clamp(20px, 4vw, 40px);
        }
        
        .poem-line {
            display: block;
            overflow: visible;
        }
        
        .line-text {
            display: inline-block;
            position: relative;
            font-size: clamp(1.15rem, 3.8vw, 1.5rem);
            line-height: clamp(1.7, 6vw, 1.9);
            padding: clamp(7px, 1.6vw, 12px) clamp(14px, 3.5vw, 26px);
            animation: slideUp 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(clamp(20px, 4vw, 30px));
            background: rgba(15, 26, 38, 0.4);
            border-radius: clamp(7px, 1.5vw, 12px);
            box-shadow: 0 clamp(4px, 1.2vw, 8px) clamp(12px, 2.5vw, 22px) rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }
        
        .final-line .line-text {
            background: rgba(230, 214, 173, 0.12);
            border: 1px solid rgba(230, 214, 173, 0.28);
            margin-top: clamp(10px, 3vw, 25px);
            padding: clamp(9px, 2.2vw, 16px) clamp(16px, 4.5vw, 32px);
            font-weight: 450;
            letter-spacing: 0.5px;
        }
        
        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }
        
        .line-text::after {
            content: '';
            position: absolute;
            right: clamp(5px, 1.8vw, 12px);
            top: 50%;
            transform: translateY(-50%);
            height: clamp(20px, 6vw, 40%);
            width: clamp(1px, 0.4vw, 2px);
            background: #e6d6ad;
            animation: blink 1.2s infinite;
            opacity: 0;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        
        .leaf {
            position: absolute;
            width: clamp(28px, 9vw, 50px);
            height: clamp(28px, 9vw, 50px);
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 5;
            opacity: 0.88;
            filter: drop-shadow(0 0 clamp(5px, 1.8vw, 10px) rgba(230, 214, 173, 0.45));
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        
        .music-control {
            position: fixed;
            bottom: clamp(22px, 7vw, 40px);
            right: clamp(22px, 7vw, 40px);
            width: clamp(48px, 13vw, 70px);
            height: clamp(48px, 13vw, 70px);
            border-radius: 50%;
            background: rgba(230, 214, 173, 0.18);
            border: 1px solid rgba(230, 214, 173, 0.55);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.35s ease;
        }
        
        .music-control:hover {
            background: rgba(230, 214, 173, 0.28);
            transform: scale(1.1);
        }
        
        .music-icon {
            color: #e6d6ad;
            font-size: clamp(22px, 7vw, 30px);
        }
        
        .final-section {
            margin-top: clamp(15px, 5vw, 30px);
            padding-top: clamp(12px, 4vw, 22px);
            position: relative;
        }
        
        .final-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(110px, 45vw, 240px);
            height: clamp(0.8px, 0.3vw, 1.5px);
            background: linear-gradient(90deg, transparent, rgba(230, 214, 173, 0.5), transparent);
        }
        
        .poem-line:nth-child(1) .line-text { animation-delay: 0.3s; }
        .poem-line:nth-child(2) .line-text { animation-delay: 0.6s; }
        .poem-line:nth-child(3) .line-text { animation-delay: 0.9s; }
        .poem-line:nth-child(4) .line-text { animation-delay: 1.2s; }
        .poem-line:nth-child(5) .line-text { animation-delay: 1.8s; }
        .poem-line:nth-child(6) .line-text { animation-delay: 2.2s; }
        
        /* 配置面板样式 */
        .config-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(12, 21, 31, 0.85);
            padding: 15px;
            border-radius: 12px;
            z-index: 100;
            border: 1px solid rgba(230, 214, 173, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 300px;
            display: none;
        }
        
        .config-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(12, 21, 31, 0.85);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 99;
            border: 1px solid rgba(230, 214, 173, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .config-toggle span {
            color: #e6d6ad;
            font-size: 22px;
        }
        
        .config-group {
            margin-bottom: 15px;
        }
        
        .config-label {
            display: block;
            color: #e6d6ad;
            margin-bottom: 6px;
            font-size: 14px;
        }
        
        .config-input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(30, 45, 60, 0.6);
            border: 1px solid rgba(230, 214, 173, 0.3);
            border-radius: 6px;
            color: #e6d6ad;
            font-size: 14px;
        }
        
        .config-button {
            background: rgba(230, 214, 173, 0.15);
            color: #e6d6ad;
            border: 1px solid rgba(230, 214, 173, 0.4);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .config-button:hover {
            background: rgba(230, 214, 173, 0.25);
        }
        
        @media (max-width: 360px) {
            .container {
                padding: 5vmin 4vmin;
                border-radius: 18px;
            }
            
            .line-text {
                white-space: normal;
                line-height: 1.6;
                padding: 8px 16px;
            }
            
            .final-line .line-text {
                padding: 9px 20px;
            }
        }
        
        @media (orientation: landscape) {
            .container {
                max-width: 75%;
                padding: 4vmin;
            }
            
            .poem-container {
                gap: 2vmin;
                margin: 2vmin 0 3vmin;
            }
            
            .line-text {
                padding: 1.2vmin 3.5vmin;
                font-size: 1.2rem;
            }
            
            .final-section {
                margin-top: 1.5vmin;
                padding-top: 1.5vmin;
            }
        }
        
        .final-section {
            margin-bottom: clamp(15px, 6vw, 40px);
        }
    </style>
</head>
<body>
    <!-- 背景图片容器 -->
    <div class="bg-image" id="bgImage"></div>
    
    <!-- 深色遮罩层 -->
    <div class="overlay"></div>
    
    <!-- 粒子背景 -->
    <canvas class="particles"></canvas>
    
    <!-- 落叶容器 -->
    <div id="leaf-container"></div>
    
    <!-- 配置面板 -->
    <div class="config-toggle" id="configToggle">
        <span>⚙️</span>
    </div>
    
    <div class="config-panel" id="configPanel">
        <div class="config-group">
            <label class="config-label">背景图片URL:</label>
            <input type="text" id="bgImageUrl" class="config-input" placeholder="https://n.sinaimg.cn/sinacn/20171102/0a90-fynnnsc4100420.jpg">
        </div>
        
        <div class="config-group">
            <label class="config-label">落叶图片URL (多个用逗号分隔):</label>
            <input type="text" id="leafImageUrls" class="config-input" placeholder="https://ts4.tc.mm.bing.net/th/id/OIP-C.9Eh41TloJcSOpjK73tlU2wHaE7?cb=thfvnext&rs=1&pid=ImgDetMain&o=7&rm=3">
        </div>
        
        <div class="config-group">
            <label class="config-label">落叶数量:</label>
            <input type="number" id="leafCount" class="config-input" value="6" min="1" max="20">
        </div>
        
        <div class="config-group">
            <label class="config-label">落叶间隔(毫秒):</label>
            <input type="number" id="leafInterval" class="config-input" value="1300" min="300" max="5000">
        </div>
        
        <button id="applyConfig" class="config-button">应用配置</button>
    </div>
    
    <div class="container">
        <h1>立秋·时序书</h1>
        
        <div class="poem-container">
            <span class="poem-line">
                <span class="line-text">夏的余烬在风里打旋</span>
            </span>
            <span class="poem-line">
                <span class="line-text">接住第一片黄叶</span>
            </span>
            <span class="poem-line">
                <span class="line-text">愿此季</span>
            </span>
            <span class="poem-line">
                <span class="line-text">生长出你期待的澄明</span>
            </span>
        </div>
        
        <div class="final-section">
            <span class="poem-line final-line">
                <span class="line-text">谷物熟 万物收</span>
            </span>
            <span class="poem-line final-line">
                <span class="line-text">一叶知秋 热爱恒久</span>
            </span>
        </div>
    </div>
    
    <div class="music-control">
        <span class="music-icon">♪</span>
    </div>
    
    <script>
        // 配置数据
        let config = {
            bgImageUrl: 'https://n.sinaimg.cn/sinacn/20171102/0a90-fynnnsc4100420.jpg',
            leafImageUrls: [
                'https://img95.699pic.com/photo/60022/4342.jpg_wh860.jpg',
                'https://img95.699pic.com/photo/60049/2701.jpg_wh860.jpg',
                'https://ts4.tc.mm.bing.net/th/id/OIP-C.9Eh41TloJcSOpjK73tlU2wHaE7?cb=thfvnext&rs=1&pid=ImgDetMain&o=7&rm=3'
            ],
            leafCount: 6,
            leafInterval: 1300
        };
        
        // 初始化配置面板
        document.getElementById('bgImageUrl').value = config.bgImageUrl;
        document.getElementById('leafImageUrls').value = config.leafImageUrls.join(', ');
        document.getElementById('leafCount').value = config.leafCount;
        document.getElementById('leafInterval').value = config.leafInterval;
        
        // 应用配置
        document.getElementById('applyConfig').addEventListener('click', function() {
            // 更新背景图片
            config.bgImageUrl = document.getElementById('bgImageUrl').value;
            document.getElementById('bgImage').style.backgroundImage = `url(${config.bgImageUrl})`;
            
            // 更新落叶图片
            const leafUrls = document.getElementById('leafImageUrls').value.split(',').map(url => url.trim());
            config.leafImageUrls = leafUrls.filter(url => url.length > 0);
            
            // 更新其他配置
            config.leafCount = parseInt(document.getElementById('leafCount').value) || 6;
            config.leafInterval = parseInt(document.getElementById('leafInterval').value) || 1300;
            
            // 重新初始化落叶系统
            initLeafSystem();
        });
        
        // 切换配置面板
        document.getElementById('configToggle').addEventListener('click', function() {
            const panel = document.getElementById('configPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        });
        
        // 设置背景图片
        document.getElementById('bgImage').style.backgroundImage = `url(${config.bgImageUrl})`;
        
        // 粒子背景系统
        const canvas = document.querySelector('.particles');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        
        const particles = [];
        const particleCount = window.innerWidth < 768 ? 100 : 140;
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * (window.innerWidth < 768 ? 2 : 2.8) + 0.8;
                this.speedX = (Math.random() - 0.5) * (window.innerWidth < 768 ? 0.2 : 0.28);
                this.speedY = (Math.random() - 0.5) * (window.innerWidth < 768 ? 0.2 : 0.28);
                this.color = `rgba(230, 214, 173, ${Math.random() * 0.2 + 0.1})`;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const maxDistance = window.innerWidth < 768 ? 100 : 130;
                    
                    if (distance < maxDistance) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(230, 214, 173, ${0.2 * (1 - distance/maxDistance)})`;
                        ctx.lineWidth = window.innerWidth < 768 ? 0.3 : 0.45;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            
            requestAnimationFrame(animateParticles);
        }
        
        // 落叶系统
        const leafContainer = document.getElementById('leaf-container');
        let leafIntervalId = null;
        
        function createLeaf() {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            
            // 随机选择落叶类型
            if (config.leafImageUrls.length > 0) {
                const imgIndex = Math.floor(Math.random() * config.leafImageUrls.length);
                leaf.style.backgroundImage = `url(${config.leafImageUrls[imgIndex]})`;
            }
            
            leaf.style.left = `${Math.random() * 100}vw`;
            leaf.style.top = '100vh';
            
            const duration = 14 + Math.random() * 10;
            const delay = Math.random() * 5;
            const rotation = Math.random() * 360;
            
            const styleSheet = document.styleSheets[0];
            const keyframeName = `float-${Date.now()}`;
            const keyframes = `
                @keyframes ${keyframeName} {
                    0% { 
                        transform: translateY(0) rotate(${rotation}deg);
                        opacity: 0;
                    }
                    10% { opacity: 1; }
                    90% { opacity: 0.8; }
                    100% { 
                        transform: translateY(-100vh) rotate(${rotation + 360}deg);
                        opacity: 0;
                    }
                }
            `;
            
            styleSheet.insertRule(keyframes, styleSheet.cssRules.length);
            
            leaf.style.animation = `${keyframeName} ${duration}s linear ${delay}s forwards`;
            leafContainer.appendChild(leaf);
            
            setTimeout(() => {
                if (leaf.parentNode === leafContainer) {
                    leaf.remove();
                }
            }, (duration + delay) * 1000);
        }
        
        function initLeafSystem() {
            // 清除现有落叶
            leafContainer.innerHTML = '';
            
            // 清除现有定时器
            if (leafIntervalId) clearInterval(leafIntervalId);
            
            // 创建初始落叶
            for (let i = 0; i < config.leafCount; i++) {
                setTimeout(createLeaf, i * 500);
            }
            
            // 设置定时器持续创建落叶
            leafIntervalId = setInterval(createLeaf, config.leafInterval);
        }
        
        // 音乐控制系统
        const musicControl = document.querySelector('.music-control');
        const audio = new Audio('https://assets.mixkit.co/music/preview/mixkit-paper-whisper-1015.mp3');
        audio.loop = true;
        let isPlaying = false;
        
        // 自动播放处理
        document.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('touchstart', initAudio, { once: true });
            document.body.addEventListener('click', initAudio, { once: true });
        });
        
        function initAudio() {
            if (!isPlaying) {
                audio.play().catch(e => console.log('播放需要用户交互'));
                isPlaying = true;
                musicControl.style.background = 'rgba(230, 214, 173, 0.3)';
                musicControl.style.transform = 'scale(1.08)';
            }
        }
        
        musicControl.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                musicControl.style.background = 'rgba(230, 214, 173, 0.18)';
                musicControl.style.transform = 'scale(1)';
            } else {
                audio.play();
                musicControl.style.background = 'rgba(230, 214, 173, 0.3)';
                musicControl.style.transform = 'scale(1.08)';
            }
            isPlaying = !isPlaying;
        });
        
        // 初始化
        window.addEventListener('load', () => {
            initParticles();
            animateParticles();
            initLeafSystem();
            
            // 确保所有内容加载完成
            setTimeout(() => {
                document.body.style.visibility = 'visible';
            }, 300);
        });
        
        // 确保所有文字可见
        window.addEventListener('resize', () => {
            document.querySelectorAll('.line-text').forEach(el => {
                el.style.display = 'inline-block';
            });
        });
    </script>
</body>
</html>
